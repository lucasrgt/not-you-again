title = "Git subprocesses flashed Windows Terminal inside GUI consumers"
lesson = "Every Git command created by the library must set CREATE_NO_WINDOW on Windows before spawning. Library callers can be GUI-subsystem processes with no inherited console, so relying on the caller to hide Git allows the default terminal broker to create a visible, focus-stealing window during repository, recall, or check operations. Preserve stdout and stderr capture and keep the flag scoped to Windows."
scope = ["src/**"]
