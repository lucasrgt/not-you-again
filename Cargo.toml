[package]
name = "not-you-again"
version = "1.1.0"
edition = "2024"
description = "A repository-local immune system for coding agents"
repository = "https://github.com/lucasrgt/not-you-again"
license = "MIT"
readme = "README.md"

[workspace]
members = ["xtask"]
resolver = "3"

[lib]
name = "nya"

[[bin]]
name = "nya"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.4", features = ["derive"] }
console = "0.16.4"
duct = "1.1.1"
dirs = "6.0.0"
glob = "0.3.4"
indicatif = "0.18.6"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
tempfile = "3.27.0"
toml = "1.1.3"
ulid = "3.0.0"
